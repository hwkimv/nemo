name: nemo
services:
  nginx-dev:
    image: nginx:1.27-alpine
    container_name: nemo-nginx-dev
    ports:
      - "8085:80"                              # http://localhost:8085
    volumes:
      - ./infra/nginx/nemo.dev.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"    # Linux 호환 (Win/macOS는 무시되어도 OK)
    profiles: ["dev"]

  nginx-prod:
    image: nginx:1.27-alpine
    container_name: nemo-nginx-prod
    ports:
      - "8085:80"
    volumes:
      - ./frontend/build/web:/usr/share/nginx/html:ro
      - ./infra/nginx/nemo.prod.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: ["prod"]

  # --- Local S3 (LocalStack) ---
  localstack:
    image: localstack/localstack:2.3
    container_name: nemo-localstack
    ports:
      - "4566:4566"     # http://localhost:4566
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=ap-northeast-2
      - PERSISTENCE=1
    volumes:
      - localstack_data:/var/lib/localstack
      - ./infra/localstack-init:/etc/localstack/init/ready.d
    profiles: [ "dev","s3" ]   # dev에서 자동 사용하거나 명시적으로 s3 켜기

  postgres-benchmark:
    image: postgres:17-alpine
    container_name: nemo-postgres-benchmark
    environment:
      POSTGRES_DB: nemo_benchmark
      POSTGRES_USER: nemo_benchmark
      POSTGRES_PASSWORD: nemo_benchmark_local_only
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nemo_benchmark -d nemo_benchmark"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_benchmark_data:/var/lib/postgresql/data
    profiles: ["benchmark"]

  postgres-concurrency:
    image: postgres:17.10-alpine
    container_name: nemo-postgres-concurrency
    environment:
      POSTGRES_DB: nemo_concurrency_measurement
      POSTGRES_USER: nemo_concurrency
      POSTGRES_PASSWORD: nemo_concurrency_local_only
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nemo_concurrency -d nemo_concurrency_measurement"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_concurrency_data:/var/lib/postgresql/data
    profiles: ["concurrency"]

  # ────────────────────────────────────────────────────────────
  # 모니터링: Actuator → Prometheus → Grafana
  #   docker compose --profile monitoring up -d
  #   Grafana  http://localhost:3000  (admin / admin)
  #   앱은 호스트에서 띄운다 (./gradlew bootRun). Prometheus가 host.docker.internal:8080을 긁는다.
  # ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: nemo-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9091:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: nemo-grafana
    environment:
      # 로컬 전용 기본 계정. 운영에 그대로 쓰지 않는다.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    profiles: ["monitoring"]

volumes:
  localstack_data:
  postgres_benchmark_data:
  postgres_concurrency_data:
  prometheus_data:
  grafana_data:
