# ============================================
# application-prod.yml
# - Spring Boot connects to Supabase PostgreSQL.
# - Secrets are injected through deployment environment variables.
# ============================================

spring:
  h2:
    console:
      enabled: false
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # =============================
      # 왜 30초가 아니라 5초인가
      # =============================
      # readiness 프로브는 커넥션을 하나 빌려 검사한다. 그래서 이 값이
      # "DB 가 죽었을 때 readiness 가 DOWN 을 답하는 데 걸리는 시간"을 그대로 결정한다.
      #
      # 실측(2026-08-22, EC2 에서 pooler IP 5432 를 DROP):
      #   connection-timeout 기본값 30초 → /readyz 가 503 을 주는 데 30.1초
      #
      # 로드밸런서의 health check 타임아웃은 보통 5~10초다. 30초가 걸리면
      # LB 입장에서 "응답 없음"과 "DOWN 응답"이 구분되지 않는다.
      # 지금은 LB 가 없어 피해가 없지만, 붙이는 순간 문제가 된다.
      #
      # 사용자 쪽에서도 같은 이야기다. DB 가 죽었을 때 30초를 기다렸다가
      # 500 을 받는 것보다 5초에 받는 편이 낫다. 어차피 결과는 실패다.
      #
      # 대가: 풀이 포화됐을 때도 5초에 실패한다. 커넥션을 오래 기다려서라도
      # 성공시키고 싶은 요청이 있다면 이 값이 짧아 손해다.
      # 현재 트래픽에서는 풀 포화가 관측된 적이 없어 이쪽을 택했다.
      # 포화가 실제로 관측되면 재검토할 값이다.
      connection-timeout: 5000
      # Hikari 는 validation-timeout 이 connection-timeout 보다 크면 거부한다.
      validation-timeout: 3000
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate.format_sql: true


app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:nemo-backend}
    access-ttl-ms: ${JWT_ACCESS_TTL_MS:900000}

  s3:
    bucket: ${AWS_S3_BUCKET:nemo-s3-prod}
    region: ${AWS_REGION:ap-northeast-2}
    endpoint: ""                    # AWS니까 endpoint 없음
    # 비워 두면 IAM Role(EC2 인스턴스 프로파일 / ECS TaskRole)에서 자격증명을 받는다.
    # 장기 Access Key는 한 번 새면 직접 폐기하기 전까지 계속 유효하다.
    # IAM Role은 수 시간마다 자동으로 도는 임시 자격증명을 준다.
    accessKey: ${AWS_ACCESS_KEY:}
    secretKey: ${AWS_SECRET_KEY:}
    pathStyle: false
    createBucketIfMissing: false

  public-base-url: ${PUBLIC_BASE_URL}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  # 🔒 지표는 별도 포트로만 노출한다.
  # /actuator/prometheus는 사용 중인 API 경로·응답시간·오류율·JVM 상태를 그대로 담고 있어
  # 공개 인터넷에 열면 서비스 내부 구조를 알려주는 것과 같다.
  # 관리 포트를 서비스 포트와 분리하고, 이 포트는 방화벽/보안그룹에서
  # Prometheus 서버만 접근하도록 막는다. Nginx도 이 포트를 프록시하지 않는다.
  server:
    port: ${MANAGEMENT_PORT:9090}
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
