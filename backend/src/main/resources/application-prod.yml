# ============================================
# application-prod.yml
# - Spring Boot connects to Supabase PostgreSQL.
# - Secrets are injected through deployment environment variables.
# ============================================

spring:
  h2:
    console:
      enabled: false
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate.format_sql: true


app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:nemo-backend}
    access-ttl-ms: ${JWT_ACCESS_TTL_MS:900000}

  s3:
    bucket: ${AWS_S3_BUCKET:nemo-s3-prod}
    region: ${AWS_REGION:ap-northeast-2}
    endpoint: ""                    # AWS니까 endpoint 없음
    accessKey: ${AWS_ACCESS_KEY}
    secretKey: ${AWS_SECRET_KEY}
    pathStyle: false
    createBucketIfMissing: false

  public-base-url: ${PUBLIC_BASE_URL}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  # 🔒 지표는 별도 포트로만 노출한다.
  # /actuator/prometheus는 사용 중인 API 경로·응답시간·오류율·JVM 상태를 그대로 담고 있어
  # 공개 인터넷에 열면 서비스 내부 구조를 알려주는 것과 같다.
  # 관리 포트를 서비스 포트와 분리하고, 이 포트는 방화벽/보안그룹에서
  # Prometheus 서버만 접근하도록 막는다. Nginx도 이 포트를 프록시하지 않는다.
  server:
    port: ${MANAGEMENT_PORT:9090}
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
