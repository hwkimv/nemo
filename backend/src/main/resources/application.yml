# ============================================
# Common application configuration
# - dev is the safe default for local execution.
# - local/prod must be selected explicitly.
# ============================================

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    multipart:
      max-file-size: 20MB
      max-request-size: 30MB

  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

server:
  port: ${PORT:8080}

# =============================
# Turnstile 캡챠 설정
# =============================
# 공통 기본값은 "꺼짐"이다. 로컬 개발과 테스트가 Cloudflare 없이 돌아야 하기 때문에
# 키에 빈 기본값을 주고 enabled를 false로 둔다. 운영에서는 application-prod.yml이
# 환경변수로 켠다.
turnstile:
  siteKey: ${TURNSTILE_SITE_KEY:}
  secretKey: ${TURNSTILE_SECRET_KEY:}
  enabled: ${TURNSTILE_ENABLED:false}

# =============================
# 로깅
# =============================
logging:
  level:
    root: INFO
    com.nemo.backend: DEBUG

naver:
  openapi:
    local:
      endpoint: https://openapi.naver.com/v1/search/local.json
    reverse:
      endpoint: https://maps.apigw.ntruss.com/map-reversegeocode/v2/gc