# ============================================
# Common application configuration
# - dev is the safe default for local execution.
# - local/prod must be selected explicitly.
# ============================================

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    multipart:
      max-file-size: 20MB
      max-request-size: 30MB

  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

server:
  port: ${PORT:8080}

# =============================
# Turnstile 캡챠 설정
# =============================
# 공통 기본값은 "꺼짐"이다. 로컬 개발과 테스트가 Cloudflare 없이 돌아야 하기 때문에
# 키에 빈 기본값을 주고 enabled를 false로 둔다. 운영에서는 application-prod.yml이
# 환경변수로 켠다.
turnstile:
  siteKey: ${TURNSTILE_SITE_KEY:}
  secretKey: ${TURNSTILE_SECRET_KEY:}
  enabled: ${TURNSTILE_ENABLED:false}

# =============================
# Actuator / 지표
# =============================
# health·info·prometheus만 연다. env·beans·heapdump 같은 나머지는 닫아 둔다.
# 운영에서 /actuator/prometheus를 공개하지 않는 방법은 application-prod.yml 참고.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  health:
    # ⚠️ mail health indicator를 끈다.
    #
    # 켜져 있으면 /actuator/health 를 부를 때마다 SMTP 서버(smtp.gmail.com)에
    # 실제로 접속을 시도한다. 두 가지가 문제다.
    #   1) health check는 보통 수 초 간격으로 계속 호출된다.
    #      그때마다 외부 SMTP에 접속하면 느리고, 메일 제공자가 차단할 수도 있다.
    #   2) 메일이 죽으면 전체 health가 DOWN이 된다. 그러면 오케스트레이터가
    #      "조회 API는 멀쩡히 서비스 중인" 인스턴스를 죽은 것으로 보고 재시작한다.
    #
    # 메일은 이메일 인증·비밀번호 재설정에 쓰는 보조 기능이다.
    # 그 가용성이 서비스 전체의 생존 여부를 결정해서는 안 된다.
    # 메일 장애는 해당 기능의 실패로 드러나야 한다.
    mail:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: nemo-backend
    # HTTP 요청 지표에 백분위 계산용 히스토그램을 켠다.
    # 이게 없으면 Prometheus에서 p95를 구할 수 없다(histogram_quantile에 쓸 버킷이 없다).
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s

# =============================
# Sentry 오류 추적
# =============================
# DSN이 비어 있으면 SDK가 비활성 상태로 동작한다. 로컬·CI·테스트에서는 아무것도 전송하지 않는다.
# 운영에서만 GitHub Secrets/환경변수로 주입한다. DSN은 저장소에 커밋하지 않는다.
#
# 보내기 전에 SentryScrubber가 Authorization 헤더·쿠키·요청 본문·환경변수를 제거한다.
# 서버 로그에서 토큰을 지웠는데 오류 추적 도구로 같은 값이 나가면 지운 의미가 없다.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  # 배포된 코드와 이벤트를 잇는 값. CI에서 커밋 SHA를 넣는다.
  release: ${SENTRY_RELEASE:}
  # 예외만 받는다. 성능 추적은 Prometheus/Grafana가 이미 하고 있어 중복이다.
  traces-sample-rate: 0
  # 이벤트에 요청 정보를 붙이되, 아래 두 값은 SDK가 자동으로 개인정보를 담지 않게 한다.
  send-default-pii: false
  max-request-body-size: none
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info

# =============================
# 로깅
# =============================
logging:
  level:
    root: INFO
    com.nemo.backend: DEBUG
  # 모든 로그 줄에 requestId를 붙여 한 요청의 흐름을 하나의 id로 추적한다.
  # 값은 RequestIdFilter가 MDC에 넣고, 응답 헤더 X-Request-Id로도 돌려준다.
  pattern:
    level: "%5p [%X{requestId:-no-req-id}]"

naver:
  openapi:
    local:
      # NAVER API HUB 이관 후 경로. 구 경로는 NCP 발급 키를 받지 않는다(401).
      endpoint: https://naverapihub.apigw.ntruss.com/search/v1/local
    reverse:
      endpoint: https://maps.apigw.ntruss.com/map-reversegeocode/v2/gc