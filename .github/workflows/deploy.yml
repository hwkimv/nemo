# NEMO 배포 (수동 실행)
#
# 이 워크플로가 하는 일
#   1) 테스트를 다시 통과시킨다 (배포 전 관문)
#   2) 이미지를 GitHub Container Registry 에 push 한다
#   3) 그 이미지를 배포하는 **정확한 명령 한 줄**을 출력한다
#
# 이 워크플로가 하지 않는 일 — 그리고 왜 안 하는지
# ------------------------------------------------
# EC2 에 직접 접속하지 않는다. push 방식 배포를 붙이려면 둘 중 하나가 필요하다.
#
#   A. SSH  — GitHub Secrets 에 SSH 개인키(장기 자격증명)를 넣고, 22번 포트를
#             GitHub 러너 대역까지 열어야 한다. 지금은 개발자 IP /32 만 열려 있다.
#             게다가 Elastic IP 를 안 붙여서 인스턴스를 켤 때마다 퍼블릭 IP 가 바뀐다.
#             호스트를 Secrets 에 박아두면 재기동마다 깨진다.
#
#   B. OIDC → SSM — 인바운드 포트도 장기 키도 필요 없어 이쪽이 더 낫다.
#             그런데 실제로 확인해 보니 구축할 수 없었다.
#               · GitHub OIDC provider 없음 (`iam list-open-id-connect-providers` → 빈 목록)
#               · 현재 IAM 사용자 권한이 IAMReadOnlyAccess — provider·role 생성 불가
#               · nemo-ec2-role 에 SSM 정책이 없어 SSM managed instance 가 아님
#
# 그래서 배포 실행은 호스트의 infra/deploy/nemo-deploy.sh 가 맡는다.
# 그 스크립트가 readiness 확인과 실패 시 자동 rollback 까지 한다.
#
# ⚠️ 이것은 **deployment automation** 이지 continuous deployment 가 아니다.
#    main push 마다 자동으로 나가지 않는다. 인스턴스가 평소 정지돼 있어
#    그렇게 하는 것이 맞지도 않다.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 배포 대상
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false # 배포는 중간에 끊지 않는다

permissions:
  contents: read
  packages: write

jobs:
  # 배포 전 관문: 테스트가 통과하지 않으면 여기서 멈춘다
  verify:
    name: 배포 전 검증
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 캐시 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 테스트
        working-directory: backend
        run: ./gradlew test --no-daemon

      # 배포 스크립트가 문법 오류로 깨지면 배포 당일에야 안다.
      # 여기서 미리 파싱한다.
      - name: 배포 스크립트 문법 검사
        run: bash -n infra/deploy/nemo-deploy.sh

  # ⚠️ 런타임 secret 을 이 워크플로에서 검사하지 않는다.
  #
  # 예전에는 DB_URL / DB_USER / DB_PASSWORD / JWT_SECRET 이 설정됐는지 확인했다.
  # 그런데 이 워크플로는 그 값을 쓰지 않는다 — 이미지 빌드와 push 만 한다.
  # 실제 주입은 EC2 의 /home/ec2-user/nemo.env 에서 일어난다.
  # 쓰지도 않는 비밀값을 GitHub 가 들고 있을 이유가 없다. 유출 반경만 넓어진다.
  #
  # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY 도 없다.
  # EC2 가 IAM Role(nemo-ec2-profile → nemo-ec2-role)로 S3 에 붙는다.
  # 오히려 이 값을 주면 S3Config 가 정적 키 분기를 타서 인스턴스 프로파일을 쓰지 않게 된다.
  push-image:
    name: 이미지 push
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 & push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/backend:${{ inputs.environment }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 배포 명령 출력
        run: |
          {
            echo "### 배포 준비 완료"
            echo ""
            echo "이미지: \`ghcr.io/${{ github.repository }}/backend:${{ github.sha }}\`"
            echo ""
            echo "EC2 호스트에서 아래 한 줄을 실행하면 배포됩니다."
            echo "readiness 확인과 실패 시 자동 rollback 이 스크립트 안에 있습니다."
            echo ""
            echo '```bash'
            echo "~/nemo-deploy.sh ${{ github.sha }}"
            echo '```'
            echo ""
            echo "| 종료 코드 | 뜻 |"
            echo "|---|---|"
            echo "| 0 | 배포 성공 (readiness 확인됨) |"
            echo "| 1 | 새 이미지 실패 → 이전 이미지로 rollback 성공 |"
            echo "| 2 | rollback 까지 실패 — 서비스가 내려가 있을 수 있음. 사람이 봐야 함 |"
            echo "| 3 | 사용법 오류 / 사전 조건 불충족 / 다른 배포 진행 중 (서비스 그대로) |"
            echo "| 4 | 배포는 성공했으나 last-good 기록 실패 — 새 버전은 정상 실행 중 |"
            echo ""
            echo "Sentry 를 쓴다면 \`SENTRY_RELEASE=${{ github.sha }}\` 를 nemo.env 에 넣으면"
            echo "이벤트와 배포된 커밋이 이어집니다."
          } >> "$GITHUB_STEP_SUMMARY"
